upm.dac.landing.section2.html=<h2>\u0627\u0641\u062a\u062e\u0627\u0631 \u0648 \u0633\u0648\u062f \u0628\u0647 \u062f\u0633\u062a \u0622\u0648\u0631\u06cc\u062f</h2><p>\u067e\u0633 \u0627\u0632 \u062a\u0648\u0633\u0639\u0647\u200c\u06cc \u0627\u0641\u0632\u0648\u0646\u0647\u200c\u06cc \u062e\u0648\u062f\u060c \u0622\u0646 \u0631\u0627 \u062f\u0631 Atlassian Marketplace \u0641\u0647\u0631\u0633\u062a \u06a9\u0646\u06cc\u062f \u062a\u0627 \u0628\u0647 \u0628\u06cc\u0634 \u0627\u0632 \u06f4\u06f5 \u0647\u0632\u0627\u0631 \u062a\u06cc\u0645 \u062a\u0648\u0633\u0639\u0647\u200c\u06cc \u0628\u0631\u062a\u0631 \u062f\u0646\u06cc\u0627 \u06a9\u0645\u06a9 \u06a9\u0646\u06cc\u062f. \u0627\u0641\u0632\u0648\u0646\u0647\u200c\u06cc \u062e\u0648\u062f \u0631\u0627 \u0628\u0631\u0627\u06cc \u062a\u0648\u0633\u0639\u0647\u200c\u06cc \u0645\u062a\u0646\u200c\u0628\u0627\u0632 \u062f\u0631 \u062f\u0633\u062a\u0631\u0633 \u0642\u0631\u0627\u0631 \u062f\u0647\u06cc\u062f \u06cc\u0627 \u0622\u0646 \u0631\u0627 <a href="https://developer.atlassian.com/x/yIaI" target="_blank">\u0628\u0647\u200c\u0633\u0627\u062f\u06af\u06cc \u0628\u0627 \u0633\u06cc\u0633\u062a\u0645 \u067e\u0631\u062f\u0627\u062e\u062a \u0645\u0627 \u06cc\u06a9\u067e\u0627\u0631\u0686\u0647 \u06a9\u0646\u06cc\u062f</a> \u062a\u0627 \u0627\u0641\u0632\u0648\u0646\u0647\u200c\u06cc \u062e\u0648\u062f \u0631\u0627 \u0628\u0641\u0631\u0648\u0634\u06cc\u062f \u0648 <a href="http://go.atlassian.com/upm-marketplace-profit" target="_blank">\u0633\u0648\u062f \u0632\u06cc\u0627\u062f\u06cc \u06a9\u0633\u0628 \u06a9\u0646\u06cc\u062f</a>.</p>
upm.dac.landing.section3.html=<h2>\u06a9\u0645\u06a9\u06cc \u0631\u0627 \u06a9\u0647 \u0634\u0627\u06cc\u0633\u062a\u0647\u200c\u0627\u0634 \u0647\u0633\u062a\u06cc\u062f \u062f\u0631\u06cc\u0627\u0641\u062a \u06a9\u0646\u06cc\u062f</h2><p>\u0628\u0627 <a href="https://developer.atlassian.com" target="_blank">\u0633\u0627\u06cc\u062a \u062a\u0648\u0633\u0639\u0647\u200c\u062f\u0647\u0646\u062f\u06af\u0627\u0646</a> \u0645\u0627 \u0645\u06cc\u200c\u062a\u0648\u0627\u0646\u06cc\u062f \u06a9\u0645\u06a9 \u0645\u0648\u0631\u062f\u0646\u06cc\u0627\u0632 \u0628\u0631\u0627\u06cc \u062a\u0628\u062f\u06cc\u0644 \u0642\u0627\u0628\u0644\u06cc\u062a \u0645\u0648\u0631\u062f\u0646\u0638\u0631 \u062e\u0648\u062f \u0628\u0647 \u0648\u0627\u0642\u0639\u06cc\u062a \u0631\u0627 \u062f\u0631\u06cc\u0627\u0641\u062a \u06a9\u0646\u06cc\u062f. \u0627\u0632 \u0622\u0645\u0648\u0632\u0634\u200c\u0647\u0627\u06cc \u062c\u0627\u0645\u0639 \u062a\u0627 \u0645\u0631\u0627\u062c\u0639 API\u060c \u0647\u0631 \u0622\u0646\u0686\u0647 \u0628\u0631\u0627\u06cc \u0634\u0631\u0648\u0639 \u0648 \u067e\u06cc\u0634\u0631\u0641\u062a \u0644\u0627\u0632\u0645 \u062f\u0627\u0631\u06cc\u062f \u062f\u0631 \u0622\u0646 \u0648\u062c\u0648\u062f \u062f\u0627\u0631\u062f. \u0628\u0631\u0627\u06cc \u0628\u0627\u062e\u0628\u0631 \u0645\u0627\u0646\u062f\u0646 \u0627\u0632 \u0622\u062e\u0631\u06cc\u0646 \u0646\u06a9\u062a\u0647\u200c\u0647\u0627 \u0648 \u062a\u0631\u0641\u0646\u062f\u0647\u0627\u060c <a class="developer-newsletter">\u062f\u0631 \u062e\u0628\u0631\u0646\u0627\u0645\u0647\u200c\u06cc \u062a\u0648\u0633\u0639\u0647\u200c\u062f\u0647\u0646\u062f\u06af\u0627\u0646 \u0645\u0627 \u062b\u0628\u062a\u200c\u0646\u0627\u0645 \u06a9\u0646\u06cc\u062f</a>.</p>
